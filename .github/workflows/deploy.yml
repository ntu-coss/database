name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 後台「立即重建」按鈕（Worker 以 GITHUB_DISPATCH_TOKEN 呼叫 GitHub API）
  repository_dispatch:
    types: [rebuild]
  schedule:
    # 每天 19:00 UTC = 03:00 Asia/Taipei
    - cron: '0 19 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 在 step 的 if 判斷用得到（secrets context 在 if 裡不可靠）
      DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
      # 正式站已上線後採 fail-closed：缺 key 就讓本次 workflow 失敗，保留上一個
      # 成功的 Pages deployment，絕不以空索引覆蓋正式資料。
      - name: Validate Drive API key
        run: |
          if [[ -z "$DRIVE_API_KEY" ]]; then
            echo "::error::DRIVE_API_KEY 未設定；停止部署以保留上一個成功版本。"
            exit 1
          fi
      # 系所清單向後台索取，再逐系遞迴走訪各系 Drive 資料夾。
      - name: Build Drive index
        run: node scripts/genIndex.mjs
        env:
          API_BASE: ${{ vars.API_BASE }}
      - run: npm run build
        env:
          API_BASE: ${{ vars.API_BASE }}
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
