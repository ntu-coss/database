name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 後台「立即重建」按鈕（Worker 以 GITHUB_DISPATCH_TOKEN 呼叫 GitHub API）
  repository_dispatch:
    types: [rebuild]
  schedule:
    # 每天 19:00 UTC = 03:00 Asia/Taipei
    - cron: '0 19 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 在 step 的 if 判斷用得到（secrets context 在 if 裡不可靠）
      DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: echo "BASE_PATH=/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
      # 系所清單向後台索取，再逐系遞迴走訪各系 Drive 資料夾。
      # 還沒設 DRIVE_API_KEY 時整步跳過：網站照樣上線，只是沒有課程資料。
      - name: Build Drive index
        if: env.DRIVE_API_KEY != ''
        run: node scripts/genIndex.mjs
        env:
          API_BASE: ${{ vars.API_BASE }}
      - name: Skip Drive index
        if: env.DRIVE_API_KEY == ''
        run: echo "::warning::DRIVE_API_KEY 未設定，略過 Drive 索引，本次部署不含課程資料。"
      - run: npm run build
        env:
          API_BASE: ${{ vars.API_BASE }}
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
